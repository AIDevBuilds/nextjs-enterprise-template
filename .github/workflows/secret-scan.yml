name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

# Documentation stops honest mistakes; this stops the rest. Fails the build if a
# credential-shaped string is committed anywhere, including in history.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-example-has-no-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .env.example contains only placeholders
        run: |
          # Flag anything that looks like a real credential rather than a
          # placeholder or a harmless default (localhost URLs, numbers, enums).
          if grep -nEi '^[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD|DSN|CREDENTIAL)[A-Z_]*=.+' .env.example; then
            echo "::error::.env.example must not contain real secret values."
            exit 1
          fi
          echo "✓ .env.example contains no secret values"
